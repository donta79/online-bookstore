<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Online Bookstore</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main>
      <h1>Book Catalogue</h1>
      <section>
        <h2>Add book</h2>
        <form id="add-book-form">
          <label>
            Title
            <input id="title" name="title" required />
          </label>
          <label>
            Author
            <input id="author" name="author" required />
          </label>
          <label>
            ISBN
            <input id="isbn" name="isbn" required />
          </label>
          <label>
            Description
            <textarea id="description" name="description" required></textarea>
          </label>
          <label class="checkbox-row">
            <input id="availability" name="availability" type="checkbox" checked />
            Available
          </label>
          <button id="submit-button" type="submit">Add book</button>
        </form>
        <p id="status" aria-live="polite"></p>
      </section>

      <section>
        <h2>Search books</h2>
        <form id="search-form">
          <label>
            Search
            <input
              id="search-query"
              name="search-query"
              placeholder="Search by title, author, or description"
            />
          </label>
          <button id="search-button" type="submit">Search</button>
        </form>
        <p id="search-status" aria-live="polite"></p>
      </section>

      <section>
        <h2>Books</h2>
        <ul id="book-list" class="book-cards"></ul>
      </section>

      <dialog id="book-details-dialog">
        <article class="details-dialog-content">
          <h2>Book details</h2>
          <dl class="details-list">
            <div>
              <dt>ID</dt>
              <dd id="details-id"></dd>
            </div>
            <div>
              <dt>Title</dt>
              <dd id="details-title"></dd>
            </div>
            <div>
              <dt>Author</dt>
              <dd id="details-author"></dd>
            </div>
            <div>
              <dt>ISBN</dt>
              <dd id="details-isbn"></dd>
            </div>
            <div>
              <dt>Description</dt>
              <dd id="details-description"></dd>
            </div>
            <div>
              <dt>Availability</dt>
              <dd id="details-availability"></dd>
            </div>
          </dl>
          <form method="dialog">
            <button id="close-details-button" type="submit">Close</button>
          </form>
        </article>
      </dialog>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
